name: mediaconverter

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-converter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-converter}
      POSTGRES_DB: ${POSTGRES_DB:-converter}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-converter} -d ${POSTGRES_DB:-converter}"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: pgsty/silo:${MINIO_VERSION:-latest}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  buckets:
    image: pgsty/silo:${MINIO_VERSION:-latest}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
        until mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin}; do sleep 1; done;
        mc mb --ignore-existing local/uploads;
        mc mb --ignore-existing local/converted;
        echo 'buckets ok';
        tail -f /dev/null
      "

  mailpit:
    image: axllent/mailpit:${MAILPIT_VERSION:-latest}
    volumes:
      - mailpit:/data
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    image: mediaconverter-app:latest
    build:
      context: ./back-end
      dockerfile: ../docker/backend.Dockerfile
    command: sh -c "npx prisma migrate deploy && node dist/main.js"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-converter}:${POSTGRES_PASSWORD:-converter}@postgres:5432/${POSTGRES_DB:-converter}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      PORT: ${API_PORT:-3000}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-200}
      MAX_ATTEMPTS: ${MAX_ATTEMPTS:-3}
      PRESIGN_EXPIRY_SECONDS: ${PRESIGN_EXPIRY_SECONDS:-1800}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      buckets:
        condition: service_started
    restart: unless-stopped

  worker:
    image: mediaconverter-app:latest
    command: node dist/worker.js
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-converter}:${POSTGRES_PASSWORD:-converter}@postgres:5432/${POSTGRES_DB:-converter}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MAX_ATTEMPTS: ${MAX_ATTEMPTS:-3}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      buckets:
        condition: service_started
    restart: unless-stopped

  notifier:
    image: mediaconverter-app:latest
    command: node dist/notifier.js
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-converter}:${POSTGRES_PASSWORD:-converter}@postgres:5432/${POSTGRES_DB:-converter}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      PRESIGN_EXPIRY_SECONDS: ${PRESIGN_EXPIRY_SECONDS:-1800}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./front-end
      dockerfile: ../docker/frontend.Dockerfile
    # shortcut: dev-server container (not a prod build) — TanStack Start beta
    # build output is unstable; upgrade to `vite build` + nitro runtime when it
    # stabilizes.
    command: npm run dev -- --host 0.0.0.0 --port 3000
    environment:
      VITE_API_URL: http://localhost:3000
    ports:
      - "${FRONTEND_PORT:-5173}:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  rabbitmq:
  minio:
  mailpit:
